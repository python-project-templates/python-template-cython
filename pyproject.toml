[build-system]
requires = [
    "hatchling",
    "hatch-cython",
    "Cython>=3",
    "setuptools",
]
build-backend = "hatchling.build"

[project]
name = "python-template-cython"
authors = [
    {name = "Python Project Template Authors", email = "3105306+timkpaine@users.noreply.github.com"},
]
description = "A Python project template with compiled Cython extensions"
readme = "README.md"
license = { text = "Apache-2.0" }
version = "0.1.0"
requires-python = ">=3.11"
keywords = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = []

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "cibuildwheel",
    "codespell",
    "Cython>=3",
    "hatch-cython",
    "hatchling",
    "mdformat",
    "mdformat-tables>=1",
    "packaging",
    "pytest",
    "pytest-cov",
    "ruff",
    "setuptools",
    "twine",
    "ty",
    "uv",
    "wheel",
]

[project.scripts]

[project.urls]
Repository = "https://github.com/python-project-templates/python-template-cython"
Homepage = "https://github.com/python-project-templates/python-template-cython"

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
commit_args = "-s"

[[tool.bumpversion.files]]
filename = "python_template_cython/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.coverage.run]
branch = true
omit = [
    "python_template_cython/tests/integration/",
    "python_template_cython/_compiled.py",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build.targets.sdist]
include = ["/python_template_cython", "/LICENSE", "/README.md", "/pyproject.toml"]
exclude = ["*.so", "*.pyd", "*.dylib", "*.c", "*.cpp"]

[tool.hatch.build.targets.wheel]
packages = [
    "python_template_cython",
]
artifacts = ["python_template_cython/*.so", "python_template_cython/*.pyd", "python_template_cython/*.dylib"]

[tool.hatch.build.targets.wheel.hooks.cython.options]
src = "python_template_cython"

[tool.hatch.build.targets.wheel.hooks.cython.options.files]
targets = ["*/_compiled.py", "*/_native.pyx"]

[tool.setuptools]
packages = ["python_template_cython"]

[tool.check-dist.sdist]
present = ["python_template_cython/_compiled.py", "python_template_cython/_native.pyx", "LICENSE", "README.md", "pyproject.toml"]
absent = ["python_template_cython/*.so", "python_template_cython/*.pyd", "python_template_cython/*.dylib"]

[tool.check-dist.wheel]
present = ["python_template_cython/_compiled*.so", "python_template_cython/_native*.so"]

[tool.cibuildwheel]
test-command = "python -m pytest --pyargs python_template_cython.tests"
test-requires = ["pytest"]

[tool.cibuildwheel.linux]
manylinux-aarch64-image = "manylinux_2_28"
manylinux-x86_64-image = "manylinux_2_28"
archs = "native"
skip = "*i686* *musllinux*"

[tool.cibuildwheel.macos]
environment = {MACOSX_DEPLOYMENT_TARGET="11.0"}
archs = "arm64"

[tool.cibuildwheel.windows]
archs = "AMD64"
skip = "*win32 *arm64"

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "python_template_cython/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "python_template_cython",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]

[tool.yardang]
title = "python template cython"
root = "README.md"
pages = ["docs/development.md"]
use-autoapi = true
